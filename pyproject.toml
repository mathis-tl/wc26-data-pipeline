[project]
name = "wc26-data-pipeline"
version = "0.1.0"
description = "World Cup 2026 data pipeline — ELT with Python, dbt-duckdb and Evidence, orchestrated by GitHub Actions"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "pyarrow>=20.0",
    "python-dotenv>=1.1",
    "tenacity>=9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "respx>=0.22",
    "ruff>=0.12",
    "pyright>=1.1.390",
    "pre-commit>=4.0",
]
dbt = [
    "dbt-core>=1.10",
    "dbt-duckdb>=1.9",
]
analytics = [
    "numpy>=2.0",
    "scipy>=1.13",
    "duckdb>=1.1",
    "soccerdata>=1.9.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F (pycodestyle, pyflakes) plus: import order, bugbear traps, py3.12
# modernisation, simplifications, and ruff's own rules.
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM", "RUF"]
# the en dash in score strings ("1–0") is a deliberate typographic choice for the front
allowed-confusables = ["–"]

[tool.pyright]
include = ["ingestion", "analytics", "tests", "dashboard/scripts"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "contract: end-to-end contract tests that need the dbt warehouse built first",
]
addopts = "-m 'not contract'"
