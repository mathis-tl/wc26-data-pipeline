name: wc26
version: "1.0.0"
profile: wc26

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]

target-path: target
clean-targets: ["target", "dbt_packages"]

# Edition parameters — everything that pins this project to the 2026 World
# Cup lives here, so a historical backfill overrides vars instead of editing
# models and tests. (Group letters stay literal in the staging yml: the
# 48-team A–L format is structural to these staging models, and historical
# editions come in through a separate source anyway — see docs/adr.)
vars:
  expected_matches: 104
  expected_teams: 48
  expected_scorers: 30
  tournament_start: "2026-06-11"
  tournament_end: "2026-07-19"
  current_year: 2026
  current_host: "USA/Canada/Mexico"

seeds:
  wc26:
    +schema: main

models:
  wc26:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table
