version: 2

sources:
  - name: football_data
    description: >
      Raw layer: football-data.org API responses archived as-is by the daily
      ingestion workflow. Parquet files partitioned by extraction date
      (Hive-style), nested structs preserved. union_by_name is mandatory to
      survive schema drift between partitions.
    schema: main
    # Freshness guard: the daily cron writes extracted_at on every row; if a
    # day of capture is silently missed, `dbt source freshness` errors — the
    # row-count tests alone cannot catch it (104 matches of stale data still
    # pass every count). Checked in the ingestion workflow, not in PR CI,
    # where the committed archive is legitimately as old as the last run.
    loaded_at_field: extracted_at
    freshness:
      warn_after: {count: 26, period: hour}
      error_after: {count: 48, period: hour}
    meta:
      external_location: >-
        read_parquet('data/raw/football_data/{name}/*/*.parquet',
        hive_partitioning=true, union_by_name=true)
    tables:
      - name: matches
        description: >
          One row per match per extraction_date. Fixtures and results share
          this dataset (distinguished by `status`). Nested structs: homeTeam,
          awayTeam, score (fullTime/halfTime/extraTime/penalties), referees.
          utcDate and lastUpdated arrive as VARCHAR and are cast in staging.
      - name: standings
        description: >
          One row per standings table entry per extraction_date, with the
          group context nested under `standing`. Official positions used by
          the reconciliation test against fct_group_standings.
      - name: scorers
        description: >
          One row per top scorer per extraction_date. Nested structs: player
          (name, nationality) and team (name, tla, crest), plus goals,
          assists, penalties, playedMatches.
