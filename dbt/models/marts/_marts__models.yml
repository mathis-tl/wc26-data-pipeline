version: 2

models:
  - name: dim_teams
    description: >
      One row per national team, from the latest standings snapshot, enriched
      with group assignment. Teams appearing only in matches are kept with
      NULL enrichments rather than silently dropped.
    config:
      contract:
        enforced: true
    data_tests:
      - row_count_equals:
          arguments:
            value: "{{ var('expected_teams') }}"
    columns:
      - name: team_id
        data_type: bigint
        data_tests:
          - unique
          - not_null
      - name: team_name
        data_type: varchar
        data_tests:
          - not_null
      - name: team_short_name
        data_type: varchar
      - name: team_tla
        data_type: varchar
      - name: team_crest_url
        data_type: varchar
      - name: group_code
        data_type: varchar

  - name: fct_matches
    description: >
      One row per match of the 2026 World Cup (latest snapshot): scores at
      every stage of play, winner, phase. Team ids are NULL for fixtures
      whose participants are not yet determined.
    config:
      contract:
        enforced: true
    data_tests:
      - row_count_equals:
          arguments:
            value: "{{ var('expected_matches') }}"
    columns:
      - name: match_id
        data_type: bigint
        data_tests:
          - unique
          - not_null
      - name: kickoff_at
        data_type: timestamp
        data_tests:
          - not_null
      - name: status
        data_type: varchar
      - name: matchday
        data_type: bigint
      - name: stage
        data_type: varchar
      - name: group_code
        data_type: varchar
      - name: home_team_id
        data_type: bigint
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_teams')
                field: team_id
      - name: home_team_name
        data_type: varchar
      - name: away_team_id
        data_type: bigint
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_teams')
                field: team_id
      - name: away_team_name
        data_type: varchar
      - name: full_time_home_goals
        data_type: bigint
        description: >
          Raw score.fullTime.home from the API. CAUTION — includes penalty-
          shootout kicks when duration = PENALTY_SHOOTOUT (verified: fullTime
          = regulation + penalties for all 4 shootout matches in this
          tournament). Do not use for goal-counting; use
          regulation_home_goals instead.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 12
              config:
                where: "full_time_home_goals is not null"
      - name: full_time_away_goals
        data_type: bigint
        description: Away-team counterpart of full_time_home_goals — same caution applies.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 12
              config:
                where: "full_time_away_goals is not null"
      - name: regulation_home_goals
        data_type: bigint
        description: >
          Goals actually scored by the home team in regulation/extra time —
          excludes penalty-shootout kicks, unlike full_time_home_goals (see
          its description). Use this for any goal-counting aggregate.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 12
              config:
                where: "regulation_home_goals is not null"
      - name: regulation_away_goals
        data_type: bigint
        description: >
          Away-team counterpart of regulation_home_goals.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 12
              config:
                where: "regulation_away_goals is not null"
      - name: half_time_home_goals
        data_type: bigint
      - name: half_time_away_goals
        data_type: bigint
      - name: extra_time_home_goals
        data_type: bigint
      - name: extra_time_away_goals
        data_type: bigint
      - name: penalty_home_goals
        data_type: bigint
      - name: penalty_away_goals
        data_type: bigint
      - name: winner
        data_type: varchar
        data_tests:
          - accepted_values:
              arguments:
                values: [HOME_TEAM, AWAY_TEAM, DRAW]
              config:
                where: "winner is not null"
      - name: duration
        data_type: varchar
      - name: last_updated_at
        data_type: timestamp
      - name: snapshot_date
        data_type: date

  - name: fct_group_standings
    description: >
      Group-stage standings computed exclusively from fct_matches with the
      FIFA tiebreaker rules: points, goal difference, goals for (criteria
      1-3), then head-to-head points / goal difference / goals for restricted
      to the perfectly tied teams (criteria 4-6).
      KNOWN LIMITATION — criterion 7 (fair play points) is not available in
      the football-data.org free tier and is therefore skipped; criterion 8
      (drawing of lots) is replaced by a deterministic team_name ASC fallback
      so results are reproducible. Reconciled against the official standings
      endpoint by the reconciliation test.
    config:
      contract:
        enforced: true
    data_tests:
      - row_count_equals:
          arguments:
            value: "{{ var('expected_teams') }}"
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - group_code
              - team_id
    columns:
      - name: group_code
        data_type: varchar
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [A, B, C, D, E, F, G, H, I, J, K, L]
      - name: team_id
        data_type: bigint
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_teams')
                field: team_id
      - name: team_name
        data_type: varchar
      - name: played
        data_type: integer
      - name: won
        data_type: integer
      - name: draw
        data_type: integer
      - name: lost
        data_type: integer
      - name: points
        data_type: integer
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 9
      - name: goals_for
        data_type: integer
      - name: goals_against
        data_type: integer
      - name: goal_diff
        data_type: integer
      - name: position
        data_type: integer
        description: Rank within the group, 1 to 4.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4]
                quote: false

  - name: mart_top_scorers
    description: >
      Tournament top scorers (latest snapshot), ranked by goals with a
      deterministic tiebreaker (fewer penalties, then assists, then name).
    config:
      contract:
        enforced: true
    data_tests:
      - row_count_equals:
          arguments:
            value: "{{ var('expected_scorers') }}"
    columns:
      - name: rank
        data_type: bigint
        data_tests:
          - unique
          - not_null
      - name: player_id
        data_type: bigint
        data_tests:
          - unique
          - not_null
      - name: player_name
        data_type: varchar
        data_tests:
          - not_null
      - name: player_nationality
        data_type: varchar
      - name: team_id
        data_type: bigint
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_teams')
                field: team_id
      - name: team_name
        data_type: varchar
      - name: team_tla
        data_type: varchar
      - name: team_crest_url
        data_type: varchar
      - name: played_matches
        data_type: bigint
      - name: goals
        data_type: bigint
        data_tests:
          - not_null
      - name: assists
        data_type: bigint
      - name: penalties
        data_type: bigint

  - name: mart_edition_comparison
    description: >
      Every men's World Cup 1930–2026 on one comparable scale. The 1930–2022
      rows come from the wc_history seed; the 2026 row is computed live from
      fct_matches with the identical goals-per-match calculation, so the
      current tournament sits honestly next to history. See ADR-0001/0005 on
      why historical context enters as a bounded second source.
    config:
      contract:
        enforced: true
    data_tests:
      - row_count_equals:
          arguments:
            value: 23  # 22 historical editions + 2026
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [year]
    columns:
      - name: year
        data_type: integer
        data_tests: [unique, not_null]
      - name: host
        data_type: varchar
        data_tests: [not_null]
      - name: winner
        data_type: varchar
        data_tests: [not_null]
      - name: teams
        data_type: integer
      - name: matches
        data_type: integer
      - name: goals
        data_type: bigint
      - name: goals_per_match
        data_type: double
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1.5
                max_value: 6.0
      - name: is_current
        data_type: boolean
        data_tests: [not_null]
      - name: goals_per_match_rank
        data_type: integer
        data_tests: [unique, not_null]

unit_tests:
  - name: head_to_head_breaks_perfect_tie
    description: >
      Alphaland and Betaland are perfectly tied on points, goal difference
      and goals for (criteria 1-3); Alphaland won the direct confrontation
      and must rank above Betaland (criteria 4-6). Gammaland leads on goals
      for. No perfect tie exists in the real 2026 group stage, hence the mock.
    model: fct_group_standings
    given:
      - input: ref('fct_matches')
        rows:
          - {match_id: 1, stage: GROUP_STAGE, status: FINISHED, group_code: X, home_team_id: 1, home_team_name: Alphaland, away_team_id: 2, away_team_name: Betaland, full_time_home_goals: 1, full_time_away_goals: 0}
          - {match_id: 2, stage: GROUP_STAGE, status: FINISHED, group_code: X, home_team_id: 3, home_team_name: Gammaland, away_team_id: 1, away_team_name: Alphaland, full_time_home_goals: 2, full_time_away_goals: 1}
          - {match_id: 3, stage: GROUP_STAGE, status: FINISHED, group_code: X, home_team_id: 2, home_team_name: Betaland, away_team_id: 3, away_team_name: Gammaland, full_time_home_goals: 2, full_time_away_goals: 1}
    expect:
      rows:
        - {group_code: X, team_id: 3, position: 1}
        - {group_code: X, team_id: 1, position: 2}
        - {group_code: X, team_id: 2, position: 3}

  - name: circular_tie_falls_back_to_team_name
    description: >
      Three teams in a perfect circular tie (identical overall AND
      head-to-head stats): criteria 1-6 cannot separate them, the
      deterministic team_name ASC fallback (criterion 8 stand-in) applies.
    model: fct_group_standings
    given:
      - input: ref('fct_matches')
        rows:
          - {match_id: 1, stage: GROUP_STAGE, status: FINISHED, group_code: Y, home_team_id: 1, home_team_name: Alphaland, away_team_id: 2, away_team_name: Betaland, full_time_home_goals: 1, full_time_away_goals: 0}
          - {match_id: 2, stage: GROUP_STAGE, status: FINISHED, group_code: Y, home_team_id: 2, home_team_name: Betaland, away_team_id: 3, away_team_name: Gammaland, full_time_home_goals: 1, full_time_away_goals: 0}
          - {match_id: 3, stage: GROUP_STAGE, status: FINISHED, group_code: Y, home_team_id: 3, home_team_name: Gammaland, away_team_id: 1, away_team_name: Alphaland, full_time_home_goals: 1, full_time_away_goals: 0}
    expect:
      rows:
        - {group_code: Y, team_id: 1, position: 1}
        - {group_code: Y, team_id: 2, position: 2}
        - {group_code: Y, team_id: 3, position: 3}
