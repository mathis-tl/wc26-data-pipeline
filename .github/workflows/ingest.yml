name: Daily raw ingestion

on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC — after the previous day's matches end in North America
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --group dbt --group analytics

      - name: Run ingestion
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: uv run python -m ingestion

      # dbt and the export are allowed to fail without aborting the job, so the
      # raw archive is still published below (a modeling failure never costs a
      # day of capture). The gate step at the end re-fails the job if either
      # broke, which triggers the failure issue.
      - name: dbt source freshness
        # Right after ingestion this must always pass; a failure means the
        # run above silently produced no new extracted_at — the one staleness
        # mode the row-count tests cannot catch.
        id: freshness
        continue-on-error: true
        run: |
          uv run dbt deps --project-dir dbt --profiles-dir dbt
          uv run dbt source freshness --project-dir dbt --profiles-dir dbt

      - name: dbt build
        id: dbt
        continue-on-error: true
        run: uv run dbt build --project-dir dbt --profiles-dir dbt

      - name: Export marts to JSON
        id: export
        if: steps.dbt.outcome == 'success'
        continue-on-error: true
        run: uv run python dashboard/scripts/export_marts.py

      - name: Run analytics (Poisson model + title simulation)
        id: analytics
        if: steps.export.outcome == 'success'
        continue-on-error: true
        run: uv run python -m analytics

      - name: Publish raw data and dashboard JSON via auto-merged PR
        # main requires PRs (protect-main ruleset) and the Actions app cannot
        # be a bypass actor on a personal repo, so the bot ships its data —
        # raw archive plus the dashboard's JSON export — through one PR it
        # merges itself. Merging into main triggers the Vercel redeploy.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw dashboard/src/data
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            BRANCH="data/ingestion-$(date -u +%Y%m%d-%H%M%S)"
            git checkout -b "$BRANCH"
            git commit -m "data: raw ingestion $(date -u +%F)"
            git push origin "$BRANCH"
            gh pr create --base main --head "$BRANCH" --label data \
              --title "data: raw ingestion $(date -u +%F)" \
              --body "Automated daily archive: raw Parquet + dashboard JSON export (main requires PRs; auto-merged by the ingestion workflow)."
            gh pr merge "$BRANCH" --squash --delete-branch
          fi

      - name: Fail if freshness, modeling, export or analytics broke
        if: steps.freshness.outcome == 'failure' || steps.dbt.outcome == 'failure' || steps.export.outcome == 'failure' || steps.analytics.outcome == 'failure'
        run: |
          echo "freshness=${{ steps.freshness.outcome }} dbt=${{ steps.dbt.outcome }} export=${{ steps.export.outcome }} analytics=${{ steps.analytics.outcome }}"
          exit 1

      - name: Open issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Ingestion failed — $(date -u +'%Y-%m-%d %H:%M UTC')" \
            --body "The daily ingestion workflow failed. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
