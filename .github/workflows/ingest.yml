name: Daily raw ingestion

on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC — after the previous day's matches end in North America
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run ingestion
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: uv run python -m ingestion

      - name: Publish raw data via auto-merged PR
        # main requires PRs (protect-main ruleset) and the Actions app cannot
        # be a bypass actor on a personal repo, so the bot ships its data
        # through a PR it merges itself.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw
          if git diff --cached --quiet; then
            echo "No raw changes to commit."
          else
            BRANCH="data/ingestion-$(date -u +%Y%m%d-%H%M%S)"
            git checkout -b "$BRANCH"
            git commit -m "data: raw ingestion $(date -u +%F)"
            git push origin "$BRANCH"
            gh pr create --base main --head "$BRANCH" \
              --title "data: raw ingestion $(date -u +%F)" \
              --body "Automated daily raw archive (main requires PRs; auto-merged by the ingestion workflow)."
            gh pr merge "$BRANCH" --squash --delete-branch
          fi

      - name: Open issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Ingestion failed — $(date -u +'%Y-%m-%d %H:%M UTC')" \
            --body "The daily ingestion workflow failed. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
